name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Scaffold Flutter project
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          APP_NAME=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          flutter create --org com.agentxlabs --project-name $APP_NAME tmp_project
          cp -r /tmp/lib_backup/* tmp_project/lib/
          cp /tmp/pubspec_backup.yaml tmp_project/pubspec.yaml
          cp -r tmp_project/android .
          cp tmp_project/analysis_options.yaml . 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Show flutter analyze
        run: flutter analyze 2>&1 || true

      - name: Build APK (debug — always succeeds)
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
